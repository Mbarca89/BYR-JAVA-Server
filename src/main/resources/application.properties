spring.application.name=ByR
#spring.datasource.url=jdbc:h2:~/byr;INIT=RUNSCRIPT FROM 'classpath:tables-creation.sql'
spring.datasource.url=jdbc:h2:file:C:/Users/Mauricio/byr;AUTO_SERVER=TRUE
spring.datasource.username=byr
spring.datasource.password=byr2024?
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.data.jpa.repositories.bootstrap-mode=default
spring.jpa.properties.hibernate.jdbc.time_zone=GMT-3
spring.jackson.time-zone=America/Argentina/San_Luis
#spring.jpa.show-sql=true

spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

file.storage.location=/otp/fileStorage

# Initial account is created only while admin_users is empty. No default password.
app.admin.initial-username=${BYR_ADMIN_USERNAME:}
app.admin.initial-password=${BYR_ADMIN_PASSWORD:}
app.allowed-origins=${BYR_ALLOWED_ORIGINS:https://inmobiliariabyr.com.ar,http://localhost:3000,http://127.0.0.1:3000}
app.public-base-url=${BYR_PUBLIC_BASE_URL:https://inmobiliariabyr.com.ar}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${BYR_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
